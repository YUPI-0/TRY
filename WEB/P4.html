<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字格式</title>
</head>
    <body>
    <h2>文字格式</h2>
<p>一般文字</p>
<p><b>一般文字粗</b></p>
<p><strong>一般文字重要</strong></p>
<!-- 老師說這是舊的不要用 -->
<p><i>一般文字斜體</i></p>
<p><em>一般文字強調</em></p>
<p><mark>一般文字標記</mark></p>
<p><small>一般文字縮小</small></p>
<p><del>一般文字刪除</del></p>
<p><ins>一般文字底線</ins></p>
<p><sub>一般文字下標</sub></p>
<p><sup>一般文字下標</sup></p>
ctrl+D可以取代選取的文字
